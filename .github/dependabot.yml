version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # Las de parche y menor van juntas en un PR: son la mayoría y revisarlas de
    # a una es lo que hace que nadie las revise.
    groups:
      menores:
        update-types:
          - minor
          - patch

    # Las mayores van sueltas: traen cambios que rompen y necesitan leerse.
    # Next y React se actualizan a mano, con el sitio andando al lado.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # eslint 10 quitó context.getFilename() y eslint-plugin-react (que trae
      # eslint-config-next) todavía lo usa: el lint revienta. Sacar cuando
      # eslint-config-next soporte eslint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Los tipos tienen que coincidir con el Node del runtime (24 en CI y
      # Vercel). Con tipos más nuevos TypeScript acepta APIs que no existen.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
